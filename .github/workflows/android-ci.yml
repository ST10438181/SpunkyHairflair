name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  api:
    name: API tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run API + database tests
        run: python -m unittest discover -s tests -v

  android:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spunkys-hairflair-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
