<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Spunky's Hairflair</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
    <div id="site-nav"></div>

    <main class="main-container">
            <div class="page-header">
                <h2><i class="fas fa-address-card"></i> Get In Touch</h2>
                <p>We'd love to hear from you</p>
            </div>
            <div class="contact-grid">
                <div class="contact-info-card">
                    <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <h3>Visit Us</h3><p>Mandalay, Mitchell's Plain</p><p>Cape Town, 7785</p>
                </div>
                <div class="contact-info-card">
                    <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                    <h3>Call Us</h3><p><a href="tel:+27812345678">+27 81 234 5678</a></p><p>Mon-Sat: 9am - 6pm</p>
                </div>
                <div class="contact-info-card">
                    <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                    <h3>Email Us</h3><p><a href="mailto:hello@spunkyshairflair.co.za">hello@spunkyshairflair.co.za</a></p><p>Response within 24hrs</p>
                </div>
                <div class="contact-info-card">
                    <div class="contact-icon"><i class="fab fa-instagram"></i></div>
                    <h3>Follow Us</h3><p>@spunkyshairflair</p><p>Instagram | Facebook</p>
                </div>
            </div>
    </main>

    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
